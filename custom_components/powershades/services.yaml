set_shade_name:
  name: Set Shade Name
  description: Rename a PoE shade on the device itself (1-50 ASCII characters); the Home Assistant device name is updated to match
  fields:
    entity_id:
      name: Entity
      description: The PowerShades cover entity to rename
      example: "cover.powershade_living_room"
      required: true
      selector:
        entity:
          domain: cover
          integration: powershades
    name:
      name: Name
      description: The new shade name
      example: "Living Room Left"
      required: true
      selector:
        text:
set_server_hostname:
  name: Set Server Hostname
  description: Set the DNS hostname the shade resolves for its own outbound connections (1-120 ASCII characters), including Check for Updates and firmware install - most usefully to correct it back to PowerShades' own domain (dashboard.powershades.com) if the untrusted-server-hostname repair issue has fired. This setting is unauthenticated on the device, so double-check the value before sending it.
  fields:
    entity_id:
      name: Entity
      description: The PowerShades cover entity whose device to reconfigure
      example: "cover.powershade_living_room"
      required: true
      selector:
        entity:
          domain: cover
          integration: powershades
    hostname:
      name: Hostname
      description: The new server hostname
      example: "dashboard.powershades.com"
      required: true
      selector:
        text:
