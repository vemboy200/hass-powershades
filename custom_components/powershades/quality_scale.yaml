rules:
  # Bronze
  action-setup: done
  comment: |
    services are registered in async_setup via async_setup_services, not tied to a config entry.
  appropriate-polling: done
  comment: |
    coordinator polls every 10 seconds (5 seconds while position is unknown), and also updates
    immediately on UDP push replies.
  brands: done
  comment: |
    icon/logo assets are in custom_components/powershades/brand/, ready to submit to
    home-assistant/brands under custom_integrations/powershades/
  common-modules: done
  comment: |
    coordinator.py, protocol.py, udp.py and discovery.py split out the shared logic cleanly;
    entity.py provides a PowerShadesEntity base class shared by the cover, button,
    sensor and binary_sensor platforms
  config-flow-test-coverage: done
  comment: |
    tests/components/powershades/test_config_flow.py covers manual entry (success, cannot_connect,
    invalid_ip, duplicate), active discovery, and DHCP discovery
  config-flow: done
  comment: |
    manual entry, active discovery, dhcp discovery and reconfiguration via rediscovery all implemented
  dependency-transparency: done
  comment: |
    network dependency declared; no other external requirements besides pyowershades
  docs-actions: done
  comment: |
    services.yaml documents all actions with descriptions and fields
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  comment: |
    CoordinatorEntity handles listener add/remove automatically
  entity-unique-id: done
  comment: |
    unique_id is based on the shade's serial number (falls back to entry_id)
  has-entity-name: done
  comment: |
    _attr_has_entity_name = True is set on cover, button, sensor and binary_sensor entities
  runtime-data: done
  comment: |
    coordinator is stored on entry.runtime_data via PowerShadesConfigEntry
  test-before-configure: done
  comment: |
    config flow probes the device with async_get_device_info before creating the entry
  test-before-setup: done
  comment: |
    async_config_entry_first_refresh raises ConfigEntryNotReady if the device doesn't respond
  unique-config-entry: done
  comment: |
    _async_abort_entries_match plus unique_id (serial number) prevents duplicate entries

  # Silver
  action-exceptions: done
  comment: |
    services raise HomeAssistantError/ServiceValidationError on failure
  config-entry-unloading: done
  comment: |
    async_unload_entry unloads platforms and closes the UDP connection via entry.async_on_unload
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  comment: |
    CoordinatorEntity marks entities unavailable automatically when polling raises UpdateFailed
  integration-owner: done
  log-when-unavailable: done
  comment: |
    DataUpdateCoordinator logs a warning when polling starts failing and when it recovers
  parallel-updates: done
  comment: |
    PARALLEL_UPDATES = 0 is set in cover.py, button.py, sensor.py, binary_sensor.py, switch.py
    and number.py
  reauthentication-flow: exempt
  comment: |
    the device has no concept of authentication, nothing to re-authenticate
  test-coverage: done
  comment: |
    tests cover the config flow, coordinator (polling, push updates, real motor state
    refresh, services, Feature Disables read-modify-write, admin-gated Gen 1 motor
    speed set, the tight-poll wait-for-stop loop and its timeout, Cloud Update
    Check/Trigger, the untrusted-server-hostname hard block on install), protocol
    parsing/building, and the cover (including the Gen 1 speed presets and the
    end-to-end reset-after-move wiring), button (including Check for Updates),
    sensor (including the Gen 2-only desired RPM sensor's conditional creation),
    binary_sensor, switch (including the Gen 1-only Reset Speed After Move
    switch's RestoreEntity behavior), number (including the Gen 1-only Reset
    Speed To number's RestoreNumber/seeding behavior), update (installed/latest
    version wiring, the version-mismatch/no-update states, the best-effort
    in_progress signal, and install triggering the device) platforms, and
    __init__.py's setup/unload flow (RF Gateway and untrusted-server-hostname
    repair issues created and cleared correctly)

  # Gold
  devices: done
  comment: |
    DeviceInfo includes identifiers, MAC connection, manufacturer, model, serial number,
    firmware revision (sw_version), and hardware generation (hw_version)
  diagnostics: done
  comment: |
    diagnostics.py returns the entry's data and the coordinator's current state,
    redacting the ip, mac, serial and unique_id, and adds decoded PoEErrorCode names
    alongside the raw error_list numbers
  discovery-update-info: done
  comment: |
    rediscovery updates the stored IP (and MAC) via _abort_if_unique_id_configured(updates=...)
  discovery: done
  comment: |
    dhcp matchers plus periodic UDP broadcast discovery (discovery.py) both create discovery flows
  docs-data-update: done
  comment: |
    "Data Updates" section explains the push + 10s/5s polling behavior
  docs-examples: done
  comment: |
    "Automation Examples" section has open/close automations
  docs-known-limitations: done
  comment: |
    "Known Limitations" section covers the UDP subscriber / last controller behavior
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  comment: |
    Added some automation examples
  dynamic-devices: exempt
  comment: |
    one device per config entry
  entity-category: done
  comment: |
    diagnostic sensors (battery, voltage, LED color, error, current RPM, motor power)
    and binary sensors (motor awake, charging), diagnostic buttons (identify, reboot,
    check for updates), config buttons (toggle, jog/limit tools), and the config
    switches/numbers (allow cloud connection, reset speed after move, reset speed to)
    use entity_category appropriately. The Speed number entity is deliberately
    uncategorized (Control) rather than Configuration - it's meant for active,
    day-to-day use (e.g. automations), not a rarely-touched setting. The cover's
    Slow/Medium/Fast speed option (CoverEntityFeature.SPEED, Gen 1 only) isn't a
    separate entity, so entity_category doesn't apply to it. Reset Speed After Move
    and Reset Speed To ARE Configuration, unlike Speed - they're one-time preferences
    about how the speed-preset feature behaves, not something touched on every use.
    The update entity is intentionally uncategorized too, matching every other update
    entity in HA core - update is its own top-level domain, not something that gets
    tucked under Diagnostic/Configuration
  entity-device-class: done
  comment: |
    battery sensor uses SensorDeviceClass.BATTERY, voltage sensor uses SensorDeviceClass.VOLTAGE,
    the LED color and error sensors use SensorDeviceClass.ENUM, the charging binary sensor uses
    BinarySensorDeviceClass.BATTERY_CHARGING (motor awake has no device_class - it reflects a
    power-management state, not motion, and no class fits that honestly), cover uses
    CoverDeviceClass.SHADE, the reboot button uses ButtonDeviceClass.RESTART, the check-for-updates
    button uses ButtonDeviceClass.UPDATE, and the update entity uses UpdateDeviceClass.FIRMWARE
  entity-disabled-by-default: done
  comment: |
    battery, voltage, charging, current RPM, motor power and desired RPM sensors, and
    the non-reversible limit buttons (set upper/lower limit, clear limits, save limits),
    are entity_registry_enabled_default=False - the latter since an accidental press could
    miscalibrate the shade's travel range. Jog/Step
    stay enabled since jogging/stepping the other way undoes them. The allow-cloud-connection
    switch is also disabled by default - most users have no reason to touch it, and it's
    not yet verified against real hardware (docs/KNOWN_BEHAVIORS.md in pyowershades),
    matching the precedent of Home Connect Local's analogous AllowBackendConnection switch.
    The Speed number entity is deliberately enabled by default instead - it's meant for
    active use (e.g. slower for nighttime automations, faster for manual use), not a
    rarely-touched setting, even though setting it is admin-gated and unverified
    against real hardware. Reset Speed After Move and Reset Speed To (Gen 1 only,
    same restriction as the cover's speed presets) are also enabled by default -
    they're how a user discovers and controls the reset-after-move behavior at all,
    so hiding them by default would defeat the point. Check for Updates and the
    firmware update entity are also enabled by default - checking is a safe, read-only
    cloud query (not admin-gated, and the device does its own fetch), so there's no
    accidental-miscalibration-style risk the way there is for the limit buttons
  entity-translations: done
  comment: |
    button, sensor, binary_sensor, switch, number and update entities use translation_key
    with names (and, for the enum LED color/error sensors, per-state names) defined under
    entity.button/entity.sensor/entity.binary_sensor/entity.switch/entity.number/entity.update in
    strings.json/translations. The cover entity also uses translation_key ("cover") to
    provide per-state names for its Slow/Medium/Fast speed capability attribute, under
    entity.cover.cover.state_attributes.speed.state
  exception-translations: done
  comment: |
    HomeAssistantError/ServiceValidationError raised from services.py and
    coordinator.py use translation_domain/translation_key/translation_placeholders,
    with messages defined under exceptions in strings.json/translations
  icon-translations: exempt
  comment: |
    icons are static (mdi:* set in code), there's nothing state-dependent to translate
  reconfiguration-flow: done
  comment: |
    async_step_reconfigure lets the user update the IP after a DHCP change;
    rejects the entry's current IP and verifies the probed serial still
    matches the entry's unique_id
  repair-issues: done
  comment: |
    a device not responding is handled by test-before-setup's ConfigEntryNotReady
    retry, not a repair issue - that's a transient condition, not something the
    user needs to act on; a non-fixable warning repair issue is created (and
    cleared on unload) if the device identifies as an RF Gateway rather than a
    PoE Shade instead, since this integration is only built and tested against
    PoE shades and that's a persistent fact worth surfacing. A non-fixable
    critical repair issue is also created (and cleared on unload) if the
    device's Server Hostname setting isn't PowerShades' own domain - checked
    at every setup via Get Serial Number's server_hostname field, independent
    of whether Check for Updates/Install has ever been used. There's nothing
    fixable from inside HA (Set Server Hostname isn't implemented), so this is
    informational like the RF Gateway issue, backed up by a hard block in
    async_install_update itself as the actual enforcement point
  stale-devices: exempt
  comment: |
    single device per config entry, nothing to go stale independently

  # Platinum
  async-dependency: done
  comment: |
    udp.py is fully asyncio based (asyncio.DatagramProtocol), no blocking calls or threads
  inject-websession: exempt
  comment: |
    uses UDP, not http(s), so there's no aiohttp session to inject
  strict-typing: done
  comment: |
    py.typed marker present, mypy strict config in pyproject.toml, and the
    integration passes `mypy --strict` cleanly
