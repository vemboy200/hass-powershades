name: RF Gateway / RF support report
description: Report your experience running hass-powershades against an RF Gateway or an RF-paired shade
title: "[RF Support]: "
labels: ["rf support"]
body:
  - type: markdown
    attributes:
      value: |
        hass-powershades is only built and tested against PoE shades. If you're running it against an RF Gateway, or a shade paired to one, this is the best place to report what you're seeing - it directly informs whether (and how) to support this properly.
  - type: input
    id: device-model
    attributes:
      label: Device model
      description: What does the device identify as? Check Settings > Devices > your PowerShade device > Model.
      placeholder: e.g. RF Gateway, PoE Shade
    validations:
      required: true
  - type: dropdown
    id: hub-generation
    attributes:
      label: RF Gateway generation, if known
      description: Gen 2 hubs have a tri-color LED; Gen 1 hubs have a single-color status LED plus a separate Ethernet LED.
      options:
        - Gen 1
        - Gen 2
        - Not sure / not applicable
    validations:
      required: false
  - type: textarea
    id: setup-experience
    attributes:
      label: What happened?
      description: Did setup succeed? Which entities showed up, and did their values look correct? Anything that clearly doesn't work?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hass-powershades version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant Home Assistant logs (Settings > System > Logs).
      render: shell
    validations:
      required: false
